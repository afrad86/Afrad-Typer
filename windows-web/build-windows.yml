name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build portable .exe
        working-directory: windows-web
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Afrad-Typer-Windows
          path: windows-web/dist/Afrad-Typer-Windows.exe
      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows-web/dist/Afrad-Typer-Windows.exe
