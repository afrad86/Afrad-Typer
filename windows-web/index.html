<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afrad Typer</title>
<meta name="author" content="Hassan Afrad">
<meta name="copyright" content="© 2026 Hassan Afrad. All rights reserved.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-96.png">
<meta name="theme-color" content="#2b2b2b">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="picker">
  <div class="card">
    <img class="biglogo-img" src="logo-256.png" alt="Afrad Typer"><div class="biglogo">Afrad Typer</div>
    <h2>Who is practising?</h2>
    <div id="plist"></div>
    <div class="adduser"><input id="newuser" placeholder="New user name" maxlength="30"><button class="primary" id="padduser">Add</button></div>
    <p class="muted">Each user has separate progress, saved in this browser on this computer. Use Progress → Export backup to move it elsewhere.</p>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="logo"><img src="logo-96.png" alt=""> Afrad</div>
    <nav id="nav"></nav>
    <div id="lvl" class="lvl"></div>
    <div id="goal" class="goal"></div>
    <div id="who"></div>
  </aside>
  <main>
    <section id="pane-today" class="pane" hidden></section>
    <section id="pane-practice" class="pane">
      <div id="top"></div>
      <div id="stats" class="tiles"></div>
      <div id="opts"></div>
      <div id="info"></div>
      <div id="box"><div id="inner"></div><div id="pause" hidden><span>Press any key to continue ...</span></div></div>
      <div id="hint"></div>
      <div id="result" hidden></div>
    </section>
    <section id="pane-progress" class="pane" hidden></section>
    <section id="pane-weak" class="pane" hidden></section>
    <section id="pane-library" class="pane" hidden></section>
    <section id="pane-guide" class="pane" hidden></section>
  </main>
</div>

<input type="file" id="avfile" accept="image/*" hidden>
<div id="foot">© 2026 Hassan Afrad. All rights reserved.</div>

<div id="fmodal" hidden><div class="mbox"><h2 id="fm-title"></h2><p id="fm-text" class="muted"></p><div id="fm-fields"></div><p id="fm-err" class="fail"></p><div class="row" style="justify-content:center"><button class="primary" id="fm-ok">OK</button><button id="fm-cancel">Cancel</button></div></div></div>

<div id="modal" hidden><div class="mbox"><h2 id="modal-title"></h2><p id="modal-text"></p><button class="primary" id="modal-ok">OK</button></div></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="desktop.js"></script>
</body>
</html>
